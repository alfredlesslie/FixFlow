        - generic [ref=f19e94]:
          - text: Campus Maintenance Challenges
          - heading "Why Campus Issue Resolution Breaks Down" [level=2] [ref=f19e95]
          - paragraph [ref=f19e96]: Universities manage thousands of facilities, classrooms, and assets. Without a unified system, everyday operational friction compounds into multi-week delays.
        - generic [ref=f19e97]:
          - generic [ref=f19e100]:
            - generic [ref=f19e101]: The Traditional Friction
            - generic [ref=f19e105]:
              - generic [ref=f19e106]:
                - heading "Scattered & Lost Channels" [level=4] [ref=f19e107]
                - paragraph [ref=f19e108]: Reports sent via random emails, front-desk sticky notes, or hallway mentions vanish with zero accountability or ticket tracking.
              - generic [ref=f19e109]:
                - heading "Duplicate Submission Avalanches" [level=4] [ref=f19e110]
                - paragraph [ref=f19e111]: When an elevator or projector stalls, 20 different individuals file identical tickets, clogging administrative queues and wasting triage hours.
              - generic [ref=f19e112]:
                - heading "Subjective & Blind Prioritization" [level=4] [ref=f19e113]
                - paragraph [ref=f19e114]: Urgent safety hazards often wait behind minor aesthetic requests simply because there is no automated scoring or impact analysis.
              - generic [ref=f19e115]:
                - heading "Zero Visibility & Ghost Closures" [level=4] [ref=f19e116]
                - paragraph [ref=f19e117]: Tickets get marked "closed" without photographic evidence, leaving students and faculty wondering whether the item was ever inspected.
          - generic [ref=f19e120]:
            - generic [ref=f19e121]: The FixFlow Operating Standard
            - generic [ref=f19e126]:
              - generic [ref=f19e127]:
                - heading "Centralized Campus Hub" [level=4] [ref=f19e128]
                - paragraph [ref=f19e129]: A single authoritative platform tied directly to buildings, rooms, and registered equipment serial numbers.
              - generic [ref=f19e130]:
                - heading "Proactive Duplicate Deduplication & Upvotes" [level=4] [ref=f19e131]
                - paragraph [ref=f19e132]: In-flight duplicate detection immediately alerts users to existing issues, turning redundant submissions into priority-boosting community votes.
              - generic [ref=f19e133]:
                - heading "Dynamic AI Priority Engine" [level=4] [ref=f19e134]
                - paragraph [ref=f19e135]: Objective scoring (0–100) dynamically balances safety hazards, location occupancy, and vote counts to dispatch the right jobs first.
              - generic [ref=f19e136]:
                - heading "Mandatory Photographic Sign-Off" [level=4] [ref=f19e137]
                - paragraph [ref=f19e138]: Field technicians must attach photographic evidence and parts usage logs before facility managers can grant final resolution approval.
